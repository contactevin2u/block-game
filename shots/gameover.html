<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="../css/app.css"></head>
<body><div id="app" class="app full"><div id="game"></div></div><div id="toast" class="toast"></div>
<script src="../js/config.js"></script><script src="../js/engine.js"></script><script src="../js/bot.js"></script><script src="../js/themes.js"></script><script src="../js/renderer.js"></script><script src="../js/input.js"></script><script src="../js/backend.js"></script><script src="../js/store.js"></script><script src="../js/adventure.js"></script><script src="../js/play.js"></script>
<script>
Backend.init();
var s = Play.start(document.getElementById('game'), { mode: 'classic' });
setTimeout(function () {
  var g = s.players[0].game;
  var stack = ['JJJLLOOZZ.', 'JSSLOOTZZ.', 'ZZSSTTTLL.', 'ZOOJJJSSL.', 'TTTOOS....', 'IIIIJJ.LLL', 'SSZZ.TTOOJ', 'LLJJSS.ZZT'];
  for (var y = 0; y < stack.length; y++) for (var x = 0; x < 10; x++) { var ch = stack[y][x]; if (ch !== '.') g.grid[Engine.ROWS - 1 - y][x] = ch; }
  g.score = 48200; g.lines = 112; g.level = 12; g.time = 401; g.stats.tetrises = 9;
  s.hideOverlay(); s.paused = false;
  g.topOut('Block out');
}, 2600);
</script></body></html>
